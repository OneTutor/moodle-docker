services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        MOODLE_DOCKER_PHP_VERSION: ${MOODLE_DOCKER_PHP_VERSION}
    image: moodle-local:${MOODLE_DOCKER_PHP_VERSION}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/bash
      - -c
      - |
        HOST_IP=$$(getent ahostsv4 host.docker.internal | awk '{print $$1; exit}')
        socat TCP-LISTEN:3000,fork,bind=127.0.0.1 TCP:$${HOST_IP}:3000 &
        socat TCP6-LISTEN:3000,fork,bind=[::1] TCP:$${HOST_IP}:3000 &
        exec moodle-docker-php-entrypoint apache2-foreground
